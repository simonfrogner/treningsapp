<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Treningsapp</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trening">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="screen-root"></main>
    <nav id="tabbar" aria-label="Hovednavigasjon">
      <button class="tab" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H10v7H4a1 1 0 0 1-1-1V11z"/></svg>
        <span>Hjem</span>
      </button>
      <button class="tab" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Historikk</span>
      </button>
      <button class="tab" data-tab="exercises">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M9 6v12M15 6v12M18 8v8M3 11h2M19 11h2"/></svg>
        <span>Øvelser</span>
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
        <span>Profil</span>
      </button>
    </nav>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
